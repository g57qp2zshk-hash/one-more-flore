<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#070b1c"><title>One More Floor</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050816;color:white;font-family:Inter,system-ui,-apple-system,sans-serif;touch-action:none;user-select:none}canvas{display:block;width:100%;height:100%}.hud{position:fixed;inset:0;pointer-events:none;padding:max(17px,env(safe-area-inset-top)) 17px max(17px,env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between}.score{font-size:44px;font-weight:1000;letter-spacing:-2px;text-shadow:0 4px 20px #000}.best{font-size:11px;font-weight:900;letter-spacing:1.5px;opacity:.7;text-align:right}.best b{display:block;font-size:22px;color:#fff}.streak{position:absolute;top:74px;left:50%;transform:translateX(-50%);font-size:13px;font-weight:1000;letter-spacing:1px;opacity:0}.sound{pointer-events:auto;position:absolute;right:17px;bottom:max(18px,env(safe-area-inset-bottom));width:44px;height:44px;border:1px solid #ffffff25;border-radius:50%;background:#0b1028aa;color:#fff;font-size:19px}.panel{pointer-events:auto;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88vw,390px);padding:31px 24px;border:1px solid #ffffff24;border-radius:30px;background:linear-gradient(145deg,#171d3ae8,#080b1be8);box-shadow:0 28px 90px #000b;text-align:center;backdrop-filter:blur(20px)}.title{font-size:48px;line-height:.88;font-weight:1000;letter-spacing:-3px;margin:0 0 14px;background:linear-gradient(120deg,#fff,#9eeaff,#c5a5ff,#ff9dd2);background-size:200%;-webkit-background-clip:text;color:transparent;animation:shine 5s linear infinite}@keyframes shine{to{background-position:200%}}.sub{opacity:.67;font-size:14px;line-height:1.5}.tap{margin:24px auto 5px;padding:16px 20px;border-radius:999px;background:#fff;color:#0a0d20;font-weight:1000;letter-spacing:.8px;box-shadow:0 10px 40px #7f8cff55}.stats{display:flex;justify-content:center;gap:30px;margin:20px 0}.stats span{font-size:10px;opacity:.55;letter-spacing:1.2px}.stats b{display:block;font-size:25px;color:#fff}.hidden{display:none}.callout{position:fixed;left:50%;top:29%;transform:translate(-50%,-50%);font-weight:1000;font-size:34px;white-space:nowrap;opacity:0;pointer-events:none;text-shadow:0 0 30px currentColor}.callout.pop{animation:pop .75s cubic-bezier(.2,.9,.25,1)}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.35) rotate(-5deg)}22%{opacity:1;transform:translate(-50%,-50%) scale(1.25) rotate(2deg)}65%{opacity:1}100%{opacity:0;transform:translate(-50%,-90%) scale(.95)}}.tiny{font-size:11px;opacity:.42;margin-top:15px}.newbest{color:#ffe981;font-weight:900;margin:5px 0}.level{position:absolute;left:17px;bottom:max(23px,env(safe-area-inset-bottom));font-size:10px;letter-spacing:1.3px;opacity:.5;font-weight:900}</style></head><body>
<canvas id="game"></canvas><div class="hud"><div class="top"><div class="score" id="score">0</div><div class="best">BEST<b id="best">0</b></div></div><div class="streak" id="streak"></div><div class="level" id="level">NEON SKY</div><button class="sound" id="sound">♫</button></div><div class="callout" id="callout">PERFECT!</div>
<div class="panel" id="start"><h1 class="title">ONE MORE<br>FLOOR</h1><div class="sub">Stack higher. Hit the center. Chain perfect landings to trigger bigger celebrations.</div><div class="tap">TAP TO BUILD</div><div class="stats"><span>BEST<b id="startBest">0</b></span></div><div class="tiny">Headphones on ♫ • Tap anywhere</div></div>
<div class="panel hidden" id="over"><div class="sub">TOWER COMPLETE</div><h1 class="title" style="margin-top:8px">GAME<br>OVER</h1><div id="newbest"></div><div class="stats"><span>SCORE<b id="finalScore">0</b></span><span>BEST STREAK<b id="maxStreak">0</b></span></div><div class="tap">ONE MORE</div><div class="tiny">Beat your tower</div></div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');let W,H,dpr,blocks=[],moving=null,falls=[],particles=[],rings=[],state='start',score=0,best=+localStorage.omfBest||0,streak=0,maxStreak=0,dir=1,speed=3,cameraY=0,last=0,shake=0,muted=false,audio=null,musicTimer=null,beat=0;
const $=id=>document.getElementById(id),scoreEl=$('score'),bestEl=$('best'),startBest=$('startBest'),streakEl=$('streak'),callout=$('callout'),start=$('start'),over=$('over');bestEl.textContent=startBest.textContent=best;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function initAudio(){if(audio||muted)return;audio=new (AudioContext||webkitAudioContext)();startMusic()}
function tone(freq,dur=.08,type='sine',vol=.025,delay=0){if(!audio||muted)return;let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+dur)}
function startMusic(){clearInterval(musicTimer);musicTimer=setInterval(()=>{if(state!=='play'||muted)return;let notes=[110,165,220,196,147,220,247,196],n=notes[beat++%notes.length];tone(n,.24,'triangle',.012);if(beat%2===0)tone(n*2,.09,'sine',.008,.04);if(beat%4===0)tone(65,.08,'sine',.018)},310)}
$('sound').onclick=e=>{e.stopPropagation();muted=!muted;$('sound').textContent=muted?'×':'♫';if(!muted)initAudio()};
function reset(){initAudio();score=0;streak=0;maxStreak=0;speed=Math.max(2.75,W/145);cameraY=0;dir=1;particles=[];falls=[];rings=[];blocks=[{x:W*.14,y:H-92,w:W*.72,h:27,i:0}];spawn();scoreEl.textContent=0;streakEl.style.opacity=0;state='play';start.classList.add('hidden');over.classList.add('hidden');$('newbest').innerHTML=''}
function spawn(){let b=blocks.at(-1);moving={x:dir>0?-b.w:W,y:b.y-39,w:b.w,h:27,i:blocks.length};dir*=-1}
function labelFor(s){if(s>=12)return['LEGENDARY!','#fff08a',5];if(s>=9)return['UNREAL!','#ff8ce8',4];if(s>=7)return['BRILLIANT!','#bda0ff',4];if(s>=5)return['AMAZING!','#70eaff',3];if(s>=3)return['GREAT!','#8dffbd',2];return['PERFECT!','#fff0a0',1]}
function celebrate(px,py){let [txt,col,power]=labelFor(streak);callout.textContent=txt;callout.style.color=col;callout.style.fontSize=(32+power*3)+'px';callout.classList.remove('pop');void callout.offsetWidth;callout.classList.add('pop');shake=power*2;rings.push({x:px,y:py,r:5,a:1,col});for(let i=0;i<14+power*14;i++){let a=Math.random()*Math.PI*2,sp=1.5+Math.random()*(3+power);particles.push({x:px,y:py,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,a:1,r:1.5+Math.random()*3,col})}tone(440+streak*25,.12,'sine',.04);tone(660+streak*30,.16,'triangle',.025,.06);if(power>=3)tone(880,.25,'sine',.018,.12);navigator.vibrate?.(power>=3?[15,25,30]:18)}
function place(){if(state==='start'||state==='over'){reset();return}if(state!=='play')return;let b=blocks.at(-1),left=Math.max(moving.x,b.x),right=Math.min(moving.x+moving.w,b.x+b.w),ov=right-left;if(ov<=0){falls.push({...moving,vy:1,rot:0});moving=null;gameOver();return}let delta=Math.abs(moving.x-b.x),tol=Math.max(5,Math.min(10,b.w*.065)),perfect=delta<=tol;if(perfect){left=b.x;ov=b.w;streak++;maxStreak=Math.max(maxStreak,streak);score+=2+streak;celebrate(b.x+b.w/2,moving.y);streakEl.textContent='STREAK ×'+streak;streakEl.style.opacity=1}else{let old=moving;if(left>old.x)falls.push({x:old.x,y:old.y,w:left-old.x,h:old.h,i:old.i,vy:0,rot:0});if(right<old.x+old.w)falls.push({x:right,y:old.y,w:old.x+old.w-right,h:old.h,i:old.i,vy:0,rot:0});streak=0;streakEl.style.opacity=0;score+=1;tone(220,.06,'square',.015)}blocks.push({x:left,y:moving.y,w:ov,h:moving.h,i:moving.i});scoreEl.textContent=score;speed=Math.min(speed*1.032+0.015,8.5);spawn()}
function gameOver(){state='over';let was=score>best;best=Math.max(best,score);localStorage.omfBest=best;bestEl.textContent=startBest.textContent=best;$('finalScore').textContent=score;$('maxStreak').textContent=maxStreak;if(was)$('newbest').innerHTML='<div class="newbest">★ NEW BEST ★</div>';tone(160,.3,'sawtooth',.025);setTimeout(()=>over.classList.remove('hidden'),430);navigator.vibrate?.([35,35,65])}
function input(e){if(e.target?.id==='sound')return;if(e.type==='keydown'&&e.code!=='Space')return;e.preventDefault?.();initAudio();place()}addEventListener('pointerdown',input,{passive:false});addEventListener('keydown',input);
function palette(i){return[(245+i*13)%360,(285+i*17)%360]}function rr(a,b,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(a+r,b);ctx.arcTo(a+w,b,a+w,b+h,r);ctx.arcTo(a+w,b+h,a,b+h,r);ctx.arcTo(a,b+h,a,b,r);ctx.arcTo(a,b,a+w,b,r);ctx.closePath()}
function block(b,oy=0){let [h1,h2]=palette(b.i),g=ctx.createLinearGradient(b.x,b.y-oy,b.x+b.w,b.y+b.h-oy);g.addColorStop(0,`hsl(${h1} 90% 68%)`);g.addColorStop(1,`hsl(${h2} 92% 57%)`);ctx.shadowColor=`hsla(${h1} 100% 65%/.5)`;ctx.shadowBlur=13;ctx.fillStyle=g;rr(b.x,b.y-oy,b.w,b.h,6);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#ffffff35';rr(b.x+2,b.y-oy+2,Math.max(0,b.w-4),4,2);ctx.fill()}
function bg(t){let phase=Math.min(1,blocks.length/45),g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,`hsl(${225+phase*40} 60% 13%)`);g.addColorStop(.55,`hsl(${260+phase*35} 55% 12%)`);g.addColorStop(1,'#030714');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);let glow=ctx.createRadialGradient(W*.72,H*.18,5,W*.72,H*.18,W*.55);glow.addColorStop(0,'#6c5cff25');glow.addColorStop(1,'transparent');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);for(let i=0;i<65;i++){let px=(i*97+Math.sin(t/2500+i)*18)%W,py=(i*139-cameraY*.08)%(H*.72);ctx.globalAlpha=.18+(i%5)*.06;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(px,py,0.7+(i%4===0),0,7);ctx.fill()}ctx.globalAlpha=1;ctx.fillStyle='#080d20';for(let i=0;i<18;i++){let bw=W/17+3,bh=25+(i*37)%110;ctx.fillRect(i*W/17,H-bh,bw,bh);ctx.fillStyle='#88aaff18';for(let y=H-bh+9;y<H;y+=14)ctx.fillRect(i*W/17+5,y,3,3);ctx.fillStyle='#080d20'}}
function draw(t){let dt=Math.min(2,(t-last)/16.67||1);last=t;ctx.save();if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.82}bg(t);if(state==='play'&&moving){moving.x+=speed*dir*dt;if(dir>0&&moving.x>W){moving.x=W;dir=-1}else if(dir<0&&moving.x+moving.w<0){moving.x=-moving.w;dir=1}}let top=blocks.at(-1)?.y||H;if(top-cameraY<H*.4)cameraY+=(top-cameraY-H*.4)*.075;for(const b of blocks)block(b,cameraY);if(moving)block(moving,cameraY);for(let i=falls.length-1;i>=0;i--){let f=falls[i];f.vy+=.32*dt;f.y+=f.vy*dt;f.x+=((f.x+f.w/2)<W/2?-1:1)*.3*dt;block(f,cameraY);if(f.y-cameraY>H+80)falls.splice(i,1)}for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.12*dt;p.a-=.024*dt;ctx.globalAlpha=Math.max(0,p.a);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y-cameraY,p.r,0,7);ctx.fill();if(p.a<=0)particles.splice(i,1)}ctx.globalAlpha=1;for(let i=rings.length-1;i>=0;i--){let r=rings[i];r.r+=8*dt;r.a-=.045*dt;ctx.globalAlpha=Math.max(0,r.a);ctx.strokeStyle=r.col;ctx.lineWidth=3;ctx.beginPath();ctx.arc(r.x,r.y-cameraY,r.r,0,7);ctx.stroke();if(r.a<=0)rings.splice(i,1)}ctx.globalAlpha=1;ctx.restore();requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></body></html>

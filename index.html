<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0a0b20"><title>One More Floor</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08091b;color:#fff;font-family:Inter,system-ui,-apple-system,sans-serif;touch-action:none;user-select:none}canvas{display:block;width:100%;height:100%}.hud{position:fixed;inset:0;pointer-events:none;padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:flex-start}.score{font-size:42px;font-weight:900;letter-spacing:-2px;text-shadow:0 3px 18px #0008}.best{font-size:12px;font-weight:800;letter-spacing:1.5px;opacity:.7;text-align:right}.best b{display:block;font-size:21px;letter-spacing:0;color:#fff}.combo{align-self:center;margin-top:4px;font-size:15px;font-weight:900;color:#ffe27a;opacity:0;transition:.15s}.panel{pointer-events:auto;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88vw,390px);padding:30px 24px;border:1px solid #ffffff20;border-radius:28px;background:linear-gradient(145deg,#15172be8,#0a0b18e8);box-shadow:0 25px 80px #0009;text-align:center;backdrop-filter:blur(18px)}.title{font-size:46px;line-height:.9;font-weight:1000;letter-spacing:-3px;margin:0 0 12px;background:linear-gradient(120deg,#fff,#b8a9ff,#67e8f9);-webkit-background-clip:text;color:transparent}.sub{opacity:.68;font-size:14px;line-height:1.45}.tap{margin:24px auto 4px;padding:15px 20px;border-radius:999px;background:#fff;color:#111327;font-weight:1000;letter-spacing:.8px;box-shadow:0 10px 35px #8976ff55}.stats{display:flex;justify-content:center;gap:30px;margin:20px 0}.stats span{font-size:11px;opacity:.55;letter-spacing:1px}.stats b{display:block;font-size:25px;opacity:1}.hidden{display:none}.perfect{position:fixed;left:50%;top:32%;transform:translate(-50%,-50%) scale(.8);font-weight:1000;font-size:30px;color:#fff1a6;text-shadow:0 0 24px #ffd85e;opacity:0;pointer-events:none}.perfect.pop{animation:pop .55s ease}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-75%) scale(1)}}.tiny{font-size:11px;opacity:.42;margin-top:16px}</style></head><body>
<canvas id="game"></canvas><div class="hud"><div class="top"><div class="score" id="score">0</div><div class="best">BEST<b id="best">0</b></div></div><div class="combo" id="combo">PERFECT ×2</div></div><div class="perfect" id="perfect">PERFECT!</div>
<div class="panel" id="start"><h1 class="title">ONE MORE<br>FLOOR</h1><div class="sub">Stack the tower. Perfect hits keep your width and build a combo.</div><div class="tap">TAP TO BUILD</div><div class="stats"><span>BEST<b id="startBest">0</b></span></div><div class="tiny">Tap anywhere • Spacebar works too</div></div>
<div class="panel hidden" id="over"><div class="sub">TOWER COMPLETE</div><h1 class="title" style="margin-top:8px">GAME<br>OVER</h1><div class="stats"><span>SCORE<b id="finalScore">0</b></span><span>PERFECTS<b id="perfects">0</b></span></div><div class="tap">ONE MORE</div><div class="tiny">Tap to restart</div></div>
<script>
const c=document.getElementById('game'),x=c.getContext('2d');let W,H,dpr,blocks=[],moving=null,particles=[],state='start',score=0,best=+localStorage.omfBest||0,combo=0,perfectCount=0,dir=1,speed=3,cameraY=0,last=0;
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),startBest=document.getElementById('startBest'),comboEl=document.getElementById('combo'),perfectEl=document.getElementById('perfect'),start=document.getElementById('start'),over=document.getElementById('over');bestEl.textContent=startBest.textContent=best;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function reset(){score=0;combo=0;perfectCount=0;speed=Math.max(2.8,W/140);cameraY=0;dir=1;particles=[];blocks=[{x:W*.15,y:H-90,w:W*.7,h:28,color:0}];spawn();scoreEl.textContent=0;comboEl.style.opacity=0;state='play';start.classList.add('hidden');over.classList.add('hidden')}
function spawn(){let b=blocks[blocks.length-1];moving={x:dir>0?-b.w:W,y:b.y-38,w:b.w,h:28,color:blocks.length};dir*=-1}
function hue(i){return (245+i*17)%360}function place(){if(state==='start'){reset();return}if(state==='over'){reset();return}if(state!=='play')return;let b=blocks[blocks.length-1],left=Math.max(moving.x,b.x),right=Math.min(moving.x+moving.w,b.x+b.w),ov=right-left;if(ov<=0){gameOver();return}let delta=Math.abs(moving.x-b.x),tol=Math.max(5,Math.min(11,b.w*.07)),perfect=delta<=tol;if(perfect){left=b.x;ov=b.w;combo++;perfectCount++;score+=1+combo;perfectEl.classList.remove('pop');void perfectEl.offsetWidth;perfectEl.classList.add('pop');burst(b.x+b.w/2,moving.y);navigator.vibrate?.(18)}else{combo=0;score+=1}blocks.push({x:left,y:moving.y,w:ov,h:moving.h,color:moving.color});scoreEl.textContent=score;if(combo>=2){comboEl.textContent='PERFECT ×'+combo;comboEl.style.opacity=1}else comboEl.style.opacity=0;speed=Math.min(speed*1.035,9);spawn()}
function burst(px,py){for(let i=0;i<18;i++)particles.push({x:px,y:py,vx:(Math.random()-.5)*7,vy:(Math.random()-1)*6,a:1,r:2+Math.random()*3})}
function gameOver(){state='over';best=Math.max(best,score);localStorage.omfBest=best;bestEl.textContent=startBest.textContent=best;document.getElementById('finalScore').textContent=score;document.getElementById('perfects').textContent=perfectCount;setTimeout(()=>over.classList.remove('hidden'),350);navigator.vibrate?.([30,30,50])}
function input(e){if(e.type==='keydown'&&e.code!=='Space')return;e.preventDefault?.();place()}addEventListener('pointerdown',input,{passive:false});addEventListener('keydown',input);
function bg(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#10143c');g.addColorStop(.55,'#171331');g.addColorStop(1,'#070817');x.fillStyle=g;x.fillRect(0,0,W,H);x.globalAlpha=.35;for(let i=0;i<45;i++){let px=(i*83)%W,py=(i*137)%(H*.7);x.fillStyle='#fff';x.fillRect(px,py,1+(i%3==0),1+(i%3==0))}x.globalAlpha=1}
function draw(t){let dt=Math.min(2,(t-last)/16.67||1);last=t;bg();if(state==='play'&&moving){moving.x+=speed*dir*dt;if(dir>0&&moving.x>W){moving.x=W;dir=-1}else if(dir<0&&moving.x+moving.w<0){moving.x=-moving.w;dir=1}}let topY=blocks[blocks.length-1]?.y||H;if(topY-cameraY<H*.38)cameraY+=(topY-cameraY-H*.38)*.08;for(const b of blocks)block(b.x,b.y-cameraY,b.w,b.h,b.color);if(moving)block(moving.x,moving.y-cameraY,moving.w,moving.h,moving.color,true);for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.25*dt;p.a-=.035*dt;x.globalAlpha=Math.max(0,p.a);x.fillStyle='#fff0a8';x.beginPath();x.arc(p.x,p.y-cameraY,p.r,0,7);x.fill();x.globalAlpha=1;if(p.a<=0)particles.splice(i,1)}requestAnimationFrame(draw)}
function block(px,py,w,h,i,m=false){let g=x.createLinearGradient(px,py,px+w,py+h);g.addColorStop(0,`hsl(${hue(i)} 90% 67%)`);g.addColorStop(1,`hsl(${(hue(i)+42)%360} 92% 58%)`);x.shadowColor=`hsla(${hue(i)} 90% 60% / .45)`;x.shadowBlur=m?18:10;x.fillStyle=g;roundRect(px,py,w,h,7);x.fill();x.shadowBlur=0;x.fillStyle='#ffffff2b';roundRect(px+2,py+2,Math.max(0,w-4),5,3);x.fill()}
function roundRect(a,b,w,h,r){r=Math.min(r,w/2,h/2);x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}requestAnimationFrame(draw);
</script></body></html>
